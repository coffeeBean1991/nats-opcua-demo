apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-ds
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: synadia-demo
      defaultBucket: sensors
      tlsSkipVerify: true
    secureJsonData:
      token: demo-token-change-me

  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
