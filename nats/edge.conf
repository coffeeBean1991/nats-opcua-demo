server_name: nats-edge
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Edge is where data is produced (closest to the OPC UA connector).
# Its JetStream domain holds SENSORS_EDGE, the origin stream that
# captures sensors.> and buffers it if the link upstream is down.
jetstream {
  store_dir: /data/jetstream
  domain: edge
}

# Edge dials out to the gateway and joins it as a leaf node.
leafnodes {
  remotes: [
    { urls: ["nats://nats-gateway:7422"] }
  ]
}
