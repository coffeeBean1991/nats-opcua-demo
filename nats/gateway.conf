server_name: nats-gateway
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Gateway is the aggregation tier: it accepts the edge as a leaf node
# on one side, and is itself a leaf node of the hub on the other side.
# Its JetStream domain holds SENSORS_GATEWAY, which sources SENSORS_EDGE
# from the edge domain.
jetstream {
  store_dir: /data/jetstream
  domain: gateway
}

leafnodes {
  listen: 0.0.0.0:7422
  remotes: [
    { urls: ["nats://nats-hub:7422"] }
  ]
}
