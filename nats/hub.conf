server_name: nats-hub
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Hub is where consumers (our NATS -> InfluxDB connector) attach.
# Its JetStream domain holds SENSORS_HUB, which sources SENSORS_GATEWAY
# from the gateway domain.
jetstream {
  store_dir: /data/jetstream
  domain: hub
}

# Hub accepts leaf node connections from the gateway.
leafnodes {
  listen: 0.0.0.0:7422
}
